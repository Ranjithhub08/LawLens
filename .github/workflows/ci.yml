name: LawLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend - Python Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic pydantic-settings flake8
      - name: Lint with flake8
        run: python -m flake8 backend/ api/ --max-line-length=120 --ignore=E501,W503,W291,W293,E302,E303,E305,E402,F401,F841,F541 --exclude=backend/tests

  frontend-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: cd frontend && npm install
      - name: Build
        run: cd frontend && npm run build

  backend-test:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic pydantic-settings pytest httpx
      - name: Run tests
        run: python -m pytest backend/tests/ -v --tb=short
